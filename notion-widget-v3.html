<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Widget</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width: 100%;
  background: #2a4a6e;
  overflow: hidden;
}

.widget {
  width: 900px;
  height: 300px;
  position: relative;
  overflow: hidden;
  font-family: 'Nunito', sans-serif;
  image-rendering: pixelated;
}

/* ── BACKGROUND IMAGE ── */
.bg {
  position: absolute;
  inset: 0;
  background-image: var(--bg-img);
  background-size: cover;
  background-position: center 30%;
  image-rendering: auto;
}

/* Gradient overlays for text visibility */
/* Top dark band for clock */
.overlay-top {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 52%;
  background: linear-gradient(
    to bottom,
    rgba(60, 20, 5, 0.72) 0%,
    rgba(80, 30, 8, 0.38) 55%,
    transparent 100%
  );
  pointer-events: none;
}

/* Bottom dark band for quote */
.overlay-bottom {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 55%;
  background: linear-gradient(
    to top,
    rgba(50, 18, 5, 0.82) 0%,
    rgba(70, 25, 8, 0.50) 50%,
    transparent 100%
  );
  pointer-events: none;
}

/* Light vignette on sides */
.overlay-sides {
  position: absolute;
  inset: 0;
  background: radial-gradient(
    ellipse 100% 100% at 50% 50%,
    transparent 55%,
    rgba(40, 12, 2, 0.30) 100%
  );
  pointer-events: none;
}

/* ── LAYOUT ── */
.layout {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 18px 48px 20px;
}

/* ── CLOCK TOP ── */
.top-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.clock {
  font-family: 'Nunito', sans-serif;
  font-weight: 900;
  font-size: 68px;
  letter-spacing: 6px;
  line-height: 1;
  color: #fff8ee;
  text-shadow:
    0 0 24px rgba(255,160,60,0.65),
    0 2px 10px rgba(0,0,0,0.7),
    0 4px 24px rgba(0,0,0,0.5);
  /* pixel-sharp but warm */
}

.date-str {
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 11.5px;
  letter-spacing: 3.5px;
  text-transform: uppercase;
  color: rgba(255, 210, 155, 0.92);
  text-shadow: 0 1px 6px rgba(0,0,0,0.8);
}

/* ── QUOTE BOTTOM ── */
.bottom-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  text-align: center;
}

.qt-mark {
  font-family: 'Nunito', sans-serif;
  font-weight: 900;
  font-size: 36px;
  line-height: 0.5;
  color: rgba(255, 170, 60, 0.90);
  display: block;
  text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  user-select: none;
}

.qt-text {
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 15.5px;
  line-height: 1.55;
  color: #fff5e8;
  text-shadow:
    0 1px 6px rgba(0,0,0,0.9),
    0 2px 16px rgba(0,0,0,0.7);
  max-width: 680px;
  transition: opacity 0.9s ease, transform 0.9s ease;
}

.qt-author {
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: rgba(255, 180, 80, 0.92);
  text-shadow: 0 1px 8px rgba(0,0,0,0.8);
  transition: opacity 0.9s ease;
}

.qt-text.fade   { opacity: 0; transform: translateY(8px); }
.qt-author.fade { opacity: 0; }

/* Pixel leaf particles floating (optional charm) */
.leaf {
  position: absolute;
  width: 8px; height: 8px;
  border-radius: 0 50% 50% 50%;
  animation: leaf-float linear infinite;
  pointer-events: none;
}
@keyframes leaf-float {
  0%   { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0; }
  10%  { opacity: 0.9; }
  85%  { opacity: 0.7; }
  100% { transform: translateY(-280px) rotate(540deg) translateX(40px); opacity: 0; }
}
</style>
</head>
<body>
<div class="widget" id="w">
  <div class="bg" id="bg"></div>
  <div class="overlay-top"></div>
  <div class="overlay-bottom"></div>
  <div class="overlay-sides"></div>

  <!-- Floating pixel leaves -->
  <div class="leaf" style="left:12%;  bottom:0; background:#ff8c2a; animation-duration:9s;  animation-delay:0s;"></div>
  <div class="leaf" style="left:28%;  bottom:0; background:#ffb840; animation-duration:12s; animation-delay:2s;  width:6px;height:6px;"></div>
  <div class="leaf" style="left:55%;  bottom:0; background:#ff6b35; animation-duration:10s; animation-delay:4s;"></div>
  <div class="leaf" style="left:72%;  bottom:0; background:#ffcc55; animation-duration:14s; animation-delay:1s;  width:6px;height:6px;"></div>
  <div class="leaf" style="left:85%;  bottom:0; background:#ff8c2a; animation-duration:11s; animation-delay:6s;"></div>

  <div class="layout">
    <!-- TOP: Clock -->
    <div class="top-section">
      <div class="clock" id="clock">00:00</div>
      <div class="date-str" id="date">—</div>
    </div>

    <!-- BOTTOM: Quote -->
    <div class="bottom-section">
      <span class="qt-mark">"</span>
      <p class="qt-text" id="qtext"></p>
      <span class="qt-author" id="qauthor"></span>
    </div>
  </div>
</div>

  const hh  = String(now.getHours()).padStart(2,'0');
  const mm  = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent = `${hh}:${mm}`;
  document.getElementById('date').textContent  =
    `${DAYS[now.getDay()]}  ·  ${MONTHS[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
}

function hourSeed() {
  const n = new Date();
  return n.getFullYear()*1e6 + n.getMonth()*1e4 + n.getDate()*100 + n.getHours();
}

let lastSeed = null;
function checkQuote(animate) {
  const s = hourSeed();
  if (s === lastSeed) return;
  lastSeed = s;
  const idx   = s % QUOTES.length;
  const qtxt  = document.getElementById('qtext');
  const qauth = document.getElementById('qauthor');
  if (animate) {
    qtxt.classList.add('fade');
    qauth.classList.add('fade');
    setTimeout(() => {
      qtxt.textContent  = QUOTES[idx].text;
      qauth.textContent = '— ' + QUOTES[idx].author;
      qtxt.classList.remove('fade');
      qauth.classList.remove('fade');
    }, 920);
  } else {
    qtxt.textContent  = QUOTES[idx].text;
    qauth.textContent = '— ' + QUOTES[idx].author;
  }
}

updateClock();
checkQuote(false);
setInterval(updateClock, 60000);
setInterval(() => checkQuote(true), 60000);
</script>
</body>
